name: uptime
# The schedule is registered when this file changes on the default branch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      simulate_down:
        description: "Target name to fail on purpose (alert test); empty for a normal run"
        required: false
        default: ""
permissions:
  contents: write # only for the keepalive commit below
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - run: node monitor.mjs state.json
        env:
          MONITOR_TARGETS: ${{ secrets.MONITOR_TARGETS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          MONITOR_SIMULATE_DOWN: ${{ github.event.inputs.simulate_down }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: uptime-state-${{ github.run_id }}
      # GitHub disables schedules in a public repository after 60 days without activity.
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: GitHub pauses idle schedules" && git push
          fi
